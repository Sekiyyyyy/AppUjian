name: Build Android APK, Windows EXE, and iOS IPA

on:
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apps.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK Release
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppUjian-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows Release
        working-directory: mobile
        run: flutter build windows --release

      - name: Compile Inno Setup Installer (.exe)
        working-directory: mobile
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer.iss

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppUjian-Windows-Installer
          path: mobile/build/installer/*.exe
          if-no-files-found: error

  build-ios:
    name: Build Apple iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable iOS Platform & Generate Config
        working-directory: mobile
        run: |
          flutter config --enable-ios
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "Generating iOS project files..."
            flutter create --platforms=ios --org com.smkn1beringin .
          fi

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into .ipa
        working-directory: mobile
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r AppUjian.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppUjian-iOS-IPA
          path: mobile/build/ios/ipa/AppUjian.ipa
          if-no-files-found: error

  # Auto-deploy: Trigger server sync after all builds complete
  deploy:
    name: Trigger Server Sync
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-ios]
    if: success()
    steps:
      - name: Trigger Artifact Sync Webhook
        run: |
          echo "🚀 Triggering artifact sync on production server..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "X-Webhook-Secret: appujian-sync-secret-2026" \
            -H "Content-Type: application/json" \
            "https://ujian.tiksmkn1beringin.my.id/api/v1/webhook/sync")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Sync webhook triggered successfully!"
          else
            echo "⚠️ Webhook returned status $RESPONSE. Manual sync may be needed."
            echo "   Run: python3 /home/server/AppUjian/sync_artifacts.py --force"
          fi

