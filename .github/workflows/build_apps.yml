name: Build Android APK and Windows EXE

on:
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build_apps.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK Release
        working-directory: mobile
        run: flutter build apk --release

      - name: Rename APK
        working-directory: mobile/build/app/outputs/flutter-apk
        run: mv app-release.apk AppUjian_v1.0.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppUjian-Android-APK
          path: mobile/build/app/outputs/flutter-apk/AppUjian_v1.0.0.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows Release
        working-directory: mobile
        run: flutter build windows --release

      - name: Compile Inno Setup Installer (.exe)
        working-directory: mobile
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer.iss

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppUjian-Windows-Installer
          path: mobile/build/installer/AppUjian_Setup_v1.0.0.exe
          if-no-files-found: error
