name: student_app
description: "Sistem Ujian Berbasis Komputer SMK - Student Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  http: ^1.2.0
  shared_preferences: ^2.2.2
  
  # QR Scanner
  mobile_scanner: ^3.5.5
  
  # State management & Routing
  provider: ^6.1.1
  go_router: ^13.0.1
  
  # Anti-cheating & Kiosk features
  flutter_windowmanager: ^0.2.0
  
  # UI styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
